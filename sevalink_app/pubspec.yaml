name: SevaLink
description: "SevaLink - Home Services Marketplace"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.7

  # Supabase
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1

  # Google Fonts
  google_fonts: ^6.2.1

  # Date/Time formatting
  intl: ^0.19.0

  # Image picking (for avatar / chat attachments)
  image_picker: ^1.1.2

  # Secure local storage (for tokens)
  flutter_secure_storage: ^9.2.2

  # FCM Push Notifications
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

  # Icons
  cupertino_icons: ^1.0.8

  # Cached images
  cached_network_image: ^3.4.1

  # Time ago
  timeago: ^3.7.0
  # Payments
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
  - assets/sevalink_logo.png
  


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/sevalink_logo.png"
